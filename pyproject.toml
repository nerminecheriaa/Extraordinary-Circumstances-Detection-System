[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-detector"
version = "0.1.0"
description = "Détection de circonstances extraordinaires (règlement CE 261/2004)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ec_detector = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]